name: Build Sealos (K8s 1.34.10) + Rancher v2.13.1 Offline Packages
on: [workflow_dispatch]

env:
  K8S_VERSION: "v1.34.10"
  RANCHER_VERSION: "v2.13.1"
  CERT_MANAGER_VERSION: "v1.16.2"
  CALICO_VERSION: "v3.28.0"
  HELM_VERSION: "v3.16.0"
  LOCAL_PATH_VERSION: "v0.0.30"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (清理 runner 磁盘空间)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Sealos & Helm
        run: |
          # 1. 安装 Sealos CLI
          wget https://github.com/labring/sealos/releases/download/v5.1.1/sealos_5.1.1_linux_amd64.tar.gz
          tar zxvf sealos_5.1.1_linux_amd64.tar.gz sealos
          chmod +x sealos
          sudo mv sealos /usr/local/bin/

          # 2. 安装 Helm CLI
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # ====================================================
      # 登录 Docker Hub (解决匿名 IP 频率限制/拉取 403 拒绝问题)
      # ====================================================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and Package All Resources
        run: |
          mkdir -p output/rancher
          
          # ====================================================
          # 1. 拉取 K8s 1.34.10 核心及网络插件 (Sealos 镜像)
          # ====================================================
          echo "===> Pulling K8s ${K8S_VERSION} Base Packages via Sealos..."
          sudo sealos pull labring/kubernetes:${K8S_VERSION}
          sudo sealos pull labring/calico:${CALICO_VERSION}
          sudo sealos pull labring/helm:${HELM_VERSION}
          sudo sealos pull labring/local-path-provisioner:${LOCAL_PATH_VERSION}

          # 导出 K8s & 本地存储离线包
          sudo sealos save -o output/kubernetes-${K8S_VERSION}.tar labring/kubernetes:${K8S_VERSION}
          sudo sealos save -o output/calico-${CALICO_VERSION}.tar labring/calico:${CALICO_VERSION}
          sudo sealos save -o output/helm-${HELM_VERSION}.tar labring/helm:${HELM_VERSION}
          sudo sealos save -o output/local-path-provisioner-${LOCAL_PATH_VERSION}.tar labring/local-path-provisioner:${LOCAL_PATH_VERSION}

          # ====================================================
          # 2. 拉取并打包 Cert-Manager v1.16.2 与 Rancher v2.13.1 的 Helm Charts
          # ====================================================
          echo "===> Fetching Helm repositories..."
          helm repo add jetstack https://charts.jetstack.io
          helm repo add rancher-stable https://releases.rancher.com/server-charts/stable
          helm repo update

          echo "===> Packaging Cert-Manager & Rancher Helm Charts..."
          helm pull jetstack/cert-manager --version ${CERT_MANAGER_VERSION} -d output/rancher/
          helm pull rancher-stable/rancher --version ${RANCHER_VERSION} -d output/rancher/

          # 验证 Helm Chart 文件有效性
          if ls output/rancher/cert-manager-*.tgz >/dev/null 2>&1 && ls output/rancher/rancher-*.tgz >/dev/null 2>&1; then
            echo "Successfully pulled Cert-Manager and Rancher Helm Charts!"
          else
            echo "ERROR: Helm charts pull failed!"
            exit 1
          fi

          # ====================================================
          # 3. 多源拉取重试函数 (解决 Docker Hub & Quay.io 镜像拦截/403问题)
          # ====================================================
          pull_and_tag() {
            local target_tag="$1"
            shift
            local candidates=("$@")
            local success=false

            echo "===================================================="
            echo "Processing Target: $target_tag"
            echo "===================================================="

            for src in "${candidates[@]}"; do
              echo "Attempting pull from: $src"
              if docker pull "$src"; then
                echo "Successfully pulled from $src"
                if [ "$src" != "$target_tag" ]; then
                  echo "Retagging $src -> $target_tag"
                  docker tag "$src" "$target_tag"
                fi
                success=true
                break
              else
                echo "Failed to pull $src, trying next mirror source..."
              fi
            done

            if [ "$success" = false ]; then
              echo "ERROR: Failed to pull $target_tag from all candidate sources!"
              exit 1
            fi
          }

          SWR_PREFIX="swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io"
          SWR_QUAY_PREFIX="swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io"
          DAO_PREFIX="docker.m.daocloud.io"
          DAO_QUAY_PREFIX="quay.m.daocloud.io"

          # 1) Rancher v2.13.1 核心镜像
          pull_and_tag "rancher/rancher:${RANCHER_VERSION}" \
            "${SWR_PREFIX}/rancher/rancher:${RANCHER_VERSION}" \
            "${DAO_PREFIX}/rancher/rancher:${RANCHER_VERSION}" \
            "rancher/rancher:${RANCHER_VERSION}"

          pull_and_tag "rancher/rancher-agent:${RANCHER_VERSION}" \
            "${SWR_PREFIX}/rancher/rancher-agent:${RANCHER_VERSION}" \
            "${DAO_PREFIX}/rancher/rancher-agent:${RANCHER_VERSION}" \
            "rancher/rancher-agent:${RANCHER_VERSION}"

          pull_and_tag "rancher/shell:v0.3.0" \
            "${SWR_PREFIX}/rancher/shell:v0.3.0" \
            "${DAO_PREFIX}/rancher/shell:v0.3.0" \
            "rancher/shell:v0.3.0"

          # 2) Cert-Manager v1.16.2 镜像 (来源于 Quay.io)
          pull_and_tag "quay.io/jetstack/cert-manager-controller:${CERT_MANAGER_VERSION}" \
            "${SWR_QUAY_PREFIX}/jetstack/cert-manager-controller:${CERT_MANAGER_VERSION}" \
            "${DAO_QUAY_PREFIX}/jetstack/cert-manager-controller:${CERT_MANAGER_VERSION}" \
            "quay.io/jetstack/cert-manager-controller:${CERT_MANAGER_VERSION}"

          pull_and_tag "quay.io/jetstack/cert-manager-cainjector:${CERT_MANAGER_VERSION}" \
            "${SWR_QUAY_PREFIX}/jetstack/cert-manager-cainjector:${CERT_MANAGER_VERSION}" \
            "${DAO_QUAY_PREFIX}/jetstack/cert-manager-cainjector:${CERT_MANAGER_VERSION}" \
            "quay.io/jetstack/cert-manager-cainjector:${CERT_MANAGER_VERSION}"

          pull_and_tag "quay.io/jetstack/cert-manager-webhook:${CERT_MANAGER_VERSION}" \
            "${SWR_QUAY_PREFIX}/jetstack/cert-manager-webhook:${CERT_MANAGER_VERSION}" \
            "${DAO_QUAY_PREFIX}/jetstack/cert-manager-webhook:${CERT_MANAGER_VERSION}" \
            "quay.io/jetstack/cert-manager-webhook:${CERT_MANAGER_VERSION}"

          pull_and_tag "quay.io/jetstack/cert-manager-startupapicheck:${CERT_MANAGER_VERSION}" \
            "${SWR_QUAY_PREFIX}/jetstack/cert-manager-startupapicheck:${CERT_MANAGER_VERSION}" \
            "${DAO_QUAY_PREFIX}/jetstack/cert-manager-startupapicheck:${CERT_MANAGER_VERSION}" \
            "quay.io/jetstack/cert-manager-startupapicheck:${CERT_MANAGER_VERSION}"

          TARGET_IMAGES=(
            "rancher/rancher:${RANCHER_VERSION}"
            "rancher/rancher-agent:${RANCHER_VERSION}"
            "rancher/shell:v0.3.0"
            "quay.io/jetstack/cert-manager-controller:${CERT_MANAGER_VERSION}"
            "quay.io/jetstack/cert-manager-cainjector:${CERT_MANAGER_VERSION}"
            "quay.io/jetstack/cert-manager-webhook:${CERT_MANAGER_VERSION}"
            "quay.io/jetstack/cert-manager-startupapicheck:${CERT_MANAGER_VERSION}"
          )

          echo "===> Saving all Rancher & Cert-Manager images..."
          docker save -o output/rancher/rancher-${RANCHER_VERSION}-images.tar "${TARGET_IMAGES[@]}"

          # 归档压缩
          cd output
          tar -zcvf rancher-${RANCHER_VERSION}-k8s-1.34.10-offline.tar.gz rancher/
          rm -rf rancher/
          
          # 开放权限防导出失败
          sudo chmod -R 777 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealos-k8s-1.34.10-rancher-v2.13.1-offline-packages
          path: |
            output/*.tar
            output/*.tar.gz
