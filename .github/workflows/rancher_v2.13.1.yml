name: Build Sealos (K8s v1.30.0) + Rancher Offline Package
on: [workflow_dispatch]

# 统一在顶部维护版本号，方便后续修改
env:
  K8S_VERSION: "v1.30.0"
  RANCHER_VERSION: "v2.8.5"          # 极稳定生产版（如需 v2.9.0 可直接修改）
  CERT_MANAGER_VERSION: "v1.14.4"
  CALICO_VERSION: "v3.26.5"
  HELM_VERSION: "v3.14.1"
  LOCAL_PATH_VERSION: "v0.0.28"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (清理 runner 磁盘空间)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Sealos & Helm
        run: |
          # 1. 安装 Sealos CLI
          wget https://github.com/labring/sealos/releases/download/v5.1.1/sealos_5.1.1_linux_amd64.tar.gz
          tar zxvf sealos_5.1.1_linux_amd64.tar.gz sealos
          chmod +x sealos
          sudo mv sealos /usr/local/bin/

          # 2. 安装 Helm CLI
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # ====================================================
      # 登录 Docker Hub (如果配置了 Secret，避免匿名 IP 限流)
      # ====================================================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and Package All Resources
        run: |
          mkdir -p output/rancher
          
          # ====================================================
          # 1. 拉取 Sealos 核心集群镜像 (带阿里云官方源容灾兜底)
          # ====================================================
          echo "===> Pulling K8s ${K8S_VERSION} Base Packages via Sealos..."
          
          sudo sealos pull labring/kubernetes:${K8S_VERSION} || \
          sudo sealos pull registry.cn-shanghai.aliyuncs.com/labring/kubernetes:${K8S_VERSION}

          sudo sealos pull labring/calico:${CALICO_VERSION} || \
          sudo sealos pull registry.cn-shanghai.aliyuncs.com/labring/calico:${CALICO_VERSION}

          sudo sealos pull labring/helm:${HELM_VERSION} || \
          sudo sealos pull registry.cn-shanghai.aliyuncs.com/labring/helm:${HELM_VERSION}

          sudo sealos pull labring/local-path-provisioner:${LOCAL_PATH_VERSION} || \
          sudo sealos pull registry.cn-shanghai.aliyuncs.com/labring/local-path-provisioner:${LOCAL_PATH_VERSION}

          # 导出底层 Sealos Tar 包
          sudo sealos save -o output/kubernetes-${K8S_VERSION}.tar labring/kubernetes:${K8S_VERSION}
          sudo sealos save -o output/calico-${CALICO_VERSION}.tar labring/calico:${CALICO_VERSION}
          sudo sealos save -o output/helm-${HELM_VERSION}.tar labring/helm:${HELM_VERSION}
          sudo sealos save -o output/local-path-provisioner-${LOCAL_PATH_VERSION}.tar labring/local-path-provisioner:${LOCAL_PATH_VERSION}

          # ====================================================
          # 2. 拉取并打包 Helm Charts (Cert-Manager & Rancher)
          # ====================================================
          echo "===> Fetching Helm repositories..."
          helm repo add jetstack https://charts.jetstack.io
          helm repo add rancher-stable https://releases.rancher.com/server-charts/stable
          helm repo update

          echo "===> Packaging Cert-Manager & Rancher Helm Charts..."
          helm pull jetstack/cert-manager --version ${CERT_MANAGER_VERSION} -d output/rancher/
          helm pull rancher-stable/rancher --version ${RANCHER_VERSION} -d output/rancher/

          # 校验 Helm Chart 文件拉取有效性
          if ls output/rancher/cert-manager-*.tgz >/dev/null 2>&1 && ls output/rancher/rancher-*.tgz >/dev/null 2>&1; then
            echo "Successfully pulled Cert-Manager and Rancher Helm Charts!"
          else
            echo "ERROR: Helm charts pull failed!"
            exit 1
          fi

          # ====================================================
          # 3. 多源拉取 Docker 镜像 (解决 Docker Hub/Quay.io 403 限流)
          # ====================================================
          pull_and_tag() {
            local target_tag="$1"
            shift
            local candidates=("$@")
            local success=false

            echo "===================================================="
            echo "Processing Target: $target_tag"
            echo "===================================================="

            for src in "${candidates[@]}"; do
              echo "Attempting pull from: $src"
              if docker pull "$src"; then
                echo "Successfully pulled from $src"
                if [ "$src" != "$target_tag" ]; then
                  echo "Retagging $src -> $target_tag"
                  docker tag "$src" "$target_tag"
                fi
                success=true
                break
              else
                echo "Failed to pull $src, trying next mirror source..."
              fi
            done

            if [ "$success" = false ]; then
              echo "ERROR: Failed to pull $target_tag from all candidate sources!"
              exit 1
            fi
          }
