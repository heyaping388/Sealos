name: Build Sealos + KS4.1 + Local Storage Offline Packages
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (清理 runner 磁盘空间)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Sealos & Helm
        run: |
          # 1. 安装 Sealos CLI
          wget https://github.com/labring/sealos/releases/download/v5.1.1/sealos_5.1.1_linux_amd64.tar.gz
          tar zxvf sealos_5.1.1_linux_amd64.tar.gz sealos
          chmod +x sealos
          sudo mv sealos /usr/local/bin/

          # 2. 安装 Helm CLI
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Pull and Package All Resources
        run: |
          mkdir -p output/kubesphere4.1
          
          # ====================================================
          # 1. 拉取 Kubernetes 核心及网络插件
          # ====================================================
          sudo sealos pull labring/kubernetes:v1.30.0
          sudo sealos pull labring/calico:v3.26.5
          sudo sealos pull labring/helm:v3.14.1

          # ====================================================
          # 2. 拉取本地持久化存储依赖 (OpenEBS & Local-Path Provisioner)
          # 包含：存储控制器、Helper 镜像、CRD 和 默认 StorageClass 配置
          # ====================================================
          sudo sealos pull labring/openebs:v3.10.0
          sudo sealos pull labring/local-path-provisioner:v0.0.28

          # 导出 K8s 与本地存储离线镜像包
          sudo sealos save -o output/kubernetes-v1.30.0.tar labring/kubernetes:v1.30.0
          sudo sealos save -o output/calico-v3.26.5.tar labring/calico:v3.26.5
          sudo sealos save -o output/helm-v3.14.1.tar labring/helm:v3.14.1
          sudo sealos save -o output/openebs-v3.10.0.tar labring/openebs:v3.10.0
          sudo sealos save -o output/local-path-provisioner-v0.0.28.tar labring/local-path-provisioner:v0.0.28

          # ====================================================
          # 3. 下载 KubeSphere 4.1.3 的 Helm Chart (ks-core)
          # ====================================================
          KS_CORE_VERSION="1.1.5"
          helm fetch https://charts.kubesphere.io/main/ks-core-${KS_CORE_VERSION}.tgz -d output/kubesphere4.1/

          # ====================================================
          # 4. 拉取 KubeSphere 4.1.3 核心镜像包
          # ====================================================
          KS_VERSION="v4.1.3"
          docker pull kubesphere/ks-apiserver:${KS_VERSION}
          docker pull kubesphere/ks-controller-manager:${KS_VERSION}
          docker pull kubesphere/ks-console:${KS_VERSION}
          docker pull kubesphere/ks-extensions-museum:v1.1.2
          docker pull kubesphere/kubectl:v1.27.16

          docker save -o output/kubesphere4.1/ks-core-images-${KS_VERSION}.tar \
            kubesphere/ks-apiserver:${KS_VERSION} \
            kubesphere/ks-controller-manager:${KS_VERSION} \
            kubesphere/ks-console:${KS_VERSION} \
            kubesphere/ks-extensions-museum:v1.1.2 \
            kubesphere/kubectl:v1.27.16

          # 压缩 KubeSphere 4.1 相关资源
          cd output
          tar -zcvf kubesphere-v4.1.3-offline.tar.gz kubesphere4.1/
          rm -rf kubesphere4.1/
          
          # 放开目录权限
          sudo chmod -R 777 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealos-ks4.1-storage-offline-packages
          path: |
            output/*.tar
            output/*.tar.gz
