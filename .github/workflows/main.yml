name: Build Sealos + KS4.1.2 + Local Storage Offline Packages
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (清理 runner 磁盘空间)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Sealos & Helm
        run: |
          # 1. 安装 Sealos CLI
          wget https://github.com/labring/sealos/releases/download/v5.1.1/sealos_5.1.1_linux_amd64.tar.gz
          tar zxvf sealos_5.1.1_linux_amd64.tar.gz sealos
          chmod +x sealos
          sudo mv sealos /usr/local/bin/

          # 2. 安装 Helm CLI
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # ====================================================
      # 登录 Docker Hub (解决匿名 IP 频率限制/拉取 403 拒绝问题)
      # ====================================================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and Package All Resources
        run: |
          mkdir -p output/kubesphere4.1
          
          # ====================================================
          # 1. 拉取 Kubernetes 核心及网络插件 (Sealos 镜像)
          # ====================================================
          sudo sealos pull labring/kubernetes:v1.30.0
          sudo sealos pull labring/calico:v3.26.5
          sudo sealos pull labring/helm:v3.14.1

          # ====================================================
          # 2. 拉取本地持久化存储依赖 (OpenEBS & Local-Path Provisioner)
          # ====================================================
          sudo sealos pull labring/openebs:v3.10.0
          sudo sealos pull labring/local-path-provisioner:v0.0.28

          # 导出 K8s & 本地存储离线包
          sudo sealos save -o output/kubernetes-v1.30.0.tar labring/kubernetes:v1.30.0
          sudo sealos save -o output/calico-v3.26.5.tar labring/calico:v3.26.5
          sudo sealos save -o output/helm-v3.14.1.tar labring/helm:v3.14.1
          sudo sealos save -o output/openebs-v3.10.0.tar labring/openebs:v3.10.0
          sudo sealos save -o output/local-path-provisioner-v0.0.28.tar labring/local-path-provisioner:v0.0.28

          # ====================================================
          # 3. 直接从 KubeSphere 源码本地打包 ks-core Helm Chart
          # (100% 避免网络拦截、网页误报和 OCI 404 问题)
          # ====================================================
          echo "===> Cloning KubeSphere v4.1.2 source code..."
          git clone --depth 1 -b v4.1.2 https://github.com/kubesphere/kubesphere.git tmp_ks_src
          
          echo "===> Packaging ks-core Helm Chart..."
          helm package tmp_ks_src/config/ks-core -d output/kubesphere4.1/
          rm -rf tmp_ks_src

          # 验证打包生成的文件类型（必须是 gzip 格式）
          if gzip -t output/kubesphere4.1/ks-core-*.tgz > /dev/null 2>&1; then
            echo "Successfully packaged valid Helm Chart!"
          else
            echo "ERROR: Helm packaging failed!"
            exit 1
          fi

          # ====================================================
          # 4. 多源拉取重试函数 (解决单一镜像源无包/403问题)
          # ====================================================
          pull_and_tag() {
            local target_tag="$1"
            shift
            local candidates=("$@")
            local success=false

            echo "===================================================="
            echo "Processing Target: $target_tag"
            echo "===================================================="

            for src in "${candidates[@]}"; do
              echo "Attempting pull from: $src"
              if docker pull "$src"; then
                echo "Successfully pulled from $src"
                if [ "$src" != "$target_tag" ]; then
                  echo "Retagging $src -> $target_tag"
                  docker tag "$src" "$target_tag"
                fi
                success=true
                break
              else
                echo "Failed to pull $src, trying next mirror source..."
              fi
            done

            if [ "$success" = false ]; then
              echo "ERROR: Failed to pull $target_tag from all candidate sources!"
              exit 1
            fi
          }

          SWR_PREFIX="swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io"
          ALI_PREFIX="registry.cn-beijing.aliyuncs.com"
          DAO_PREFIX="docker.m.daocloud.io"

          # 依次拉取 8 个核心镜像 (多源备用容灾)
          pull_and_tag "kubesphere/ks-apiserver:v4.1.2" \
            "${SWR_PREFIX}/kubesphere/ks-apiserver:v4.1.2" \
            "${ALI_PREFIX}/kse/ks-apiserver:v4.1.2" \
            "${DAO_PREFIX}/kubesphere/ks-apiserver:v4.1.2" \
            "kubesphere/ks-apiserver:v4.1.2"

          pull_and_tag "kubesphere/ks-console:v4.1.2" \
            "${SWR_PREFIX}/kubesphere/ks-console:v4.1.2" \
            "${ALI_PREFIX}/kse/ks-console:v4.1.2" \
            "${DAO_PREFIX}/kubesphere/ks-console:v4.1.2" \
            "kubesphere/ks-console:v4.1.2"

          pull_and_tag "kubesphere/ks-controller-manager:v4.1.2" \
            "${SWR_PREFIX}/kubesphere/ks-controller-manager:v4.1.2" \
            "${ALI_PREFIX}/kse/ks-controller-manager:v4.1.2" \
            "${DAO_PREFIX}/kubesphere/ks-controller-manager:v4.1.2" \
            "kubesphere/ks-controller-manager:v4.1.2"

          pull_and_tag "kubesphere/kubectl:v1.27.16" \
            "${SWR_PREFIX}/kubesphere/kubectl:v1.27.16" \
            "${ALI_PREFIX}/kubesphereio/kubectl:v1.27.16" \
            "${DAO_PREFIX}/kubesphere/kubectl:v1.27.16" \
            "kubesphere/kubectl:v1.27.16"

          pull_and_tag "kubesphere/redis:7.2.4-alpine" \
            "${SWR_PREFIX}/kubesphere/redis:7.2.4-alpine" \
            "${ALI_PREFIX}/kubesphereio/redis:7.2.4-alpine" \
            "${DAO_PREFIX}/kubesphere/redis:7.2.4-alpine" \
            "kubesphere/redis:7.2.4-alpine"

          pull_and_tag "kubesphere/haproxy:2.9.6-alpine" \
            "${SWR_PREFIX}/kubesphere/haproxy:2.9.6-alpine" \
            "${ALI_PREFIX}/kubesphereio/haproxy:2.9.6-alpine" \
            "${DAO_PREFIX}/kubesphere/haproxy:2.9.6-alpine" \
            "kubesphere/haproxy:2.9.6-alpine"

          pull_and_tag "kubesphere/ks-extensions-museum:v1.1.2" \
            "${SWR_PREFIX}/kubesphere/ks-extensions-museum:v1.1.2" \
            "${ALI_PREFIX}/kse/extensions-museum:v1.1.2" \
            "${DAO_PREFIX}/kubesphere/ks-extensions-museum:v1.1.2" \
            "kubesphere/ks-extensions-museum:v1.1.2"

          pull_and_tag "kubesphere/ks-posthog:v2.0.0" \
            "${ALI_PREFIX}/kse/ks-posthog:v2.0.0" \
            "${DAO_PREFIX}/kubesphere/ks-posthog:v2.0.0" \
            "${SWR_PREFIX}/kubesphere/ks-posthog:v2.0.0" \
            "kubesphere/ks-posthog:v2.0.0"

          TARGET_IMAGES=(
            "kubesphere/ks-apiserver:v4.1.2"
            "kubesphere/ks-console:v4.1.2"
            "kubesphere/ks-controller-manager:v4.1.2"
            "kubesphere/kubectl:v1.27.16"
            "kubesphere/redis:7.2.4-alpine"
            "kubesphere/haproxy:2.9.6-alpine"
            "kubesphere/ks-extensions-museum:v1.1.2"
            "kubesphere/ks-posthog:v2.0.0"
          )

          echo "===> Saving all KubeSphere v4.1.2 images..."
          docker save -o output/kubesphere4.1/ks-core-images-v4.1.2.tar "${TARGET_IMAGES[@]}"

          # 归档打包
          cd output
          tar -zcvf kubesphere-v4.1.2-offline.tar.gz kubesphere4.1/
          rm -rf kubesphere4.1/
          
          # 放开目录权限
          sudo chmod -R 777 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealos-ks4.1.2-offline-packages
          path: |
            output/*.tar
            output/*.tar.gz
