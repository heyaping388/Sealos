name: Build Sealos Offline Packages
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download and Install Sealos
        run: |
          wget https://github.com/labring/sealos/releases/download/v5.1.1/sealos_5.1.1_linux_amd64.tar.gz
          tar zxvf sealos_5.1.1_linux_amd64.tar.gz sealos
          chmod +x sealos
          sudo mv sealos /usr/local/bin/

      - name: Pull and Save Images
        run: |
          mkdir output
          
          # 1. 拉取 Kubernetes 镜像 (已验证存在)
          sudo sealos pull labring/kubernetes:v1.30.0
          
          # 2. 拉取 Calico 镜像 (更换为存在的 v3.26.5 版本)
          sudo sealos pull labring/calico:v3.26.5
          
          # 3. 拉取 Helm 镜像 (可选，推荐 v3.14.1)
          sudo sealos pull labring/helm:v3.14.1

          # 4. 导出为离线包
          sudo sealos save -o output/k8s-v1.30.0.tar labring/kubernetes:v1.30.0
          sudo sealos save -o output/calico-v3.26.5.tar labring/calico:v3.26.5
          sudo sealos save -o output/helm-v3.14.1.tar labring/helm:v3.14.1
          
          # 5. 放开文件权限
          sudo chmod -R 777 output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealos-offline-packages
          path: output/*.tar
