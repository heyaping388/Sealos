name: Build Sealos + KS4.1.2 + Local Storage Offline Packages
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (清理 runner 磁盘空间)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Sealos & Helm
        run: |
          # 1. 安装 Sealos CLI
          wget https://github.com/labring/sealos/releases/download/v5.1.1/sealos_5.1.1_linux_amd64.tar.gz
          tar zxvf sealos_5.1.1_linux_amd64.tar.gz sealos
          chmod +x sealos
          sudo mv sealos /usr/local/bin/

          # 2. 安装 Helm CLI
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Pull and Package All Resources
        run: |
          mkdir -p output/kubesphere4.1
          
          # ====================================================
          # 1. 拉取 Kubernetes 核心及网络插件 (Sealos 镜像)
          # ====================================================
          sudo sealos pull labring/kubernetes:v1.30.0
          sudo sealos pull labring/calico:v3.26.5
          sudo sealos pull labring/helm:v3.14.1

          # ====================================================
          # 2. 拉取本地持久化存储依赖 (OpenEBS & Local-Path Provisioner)
          # ====================================================
          sudo sealos pull labring/openebs:v3.10.0
          sudo sealos pull labring/local-path-provisioner:v0.0.28

          # 导出 K8s & 本地存储离线包
          sudo sealos save -o output/kubernetes-v1.30.0.tar labring/kubernetes:v1.30.0
          sudo sealos save -o output/calico-v3.26.5.tar labring/calico:v3.26.5
          sudo sealos save -o output/helm-v3.14.1.tar labring/helm:v3.14.1
          sudo sealos save -o output/openebs-v3.10.0.tar labring/openebs:v3.10.0
          sudo sealos save -o output/local-path-provisioner-v0.0.28.tar labring/local-path-provisioner:v0.0.28

          # ====================================================
          # 3. 下载 KubeSphere 4.1.2 的 Helm Chart (ks-core)
          # ====================================================
          helm fetch https://charts.kubesphere.io/main/ks-core-1.1.2.tgz -d output/kubesphere4.1/

          # ====================================================
          # 4. 从 SWR 镜像源拉取 KubeSphere v4.1.2 完整依赖并重命名
          # ====================================================
          SWR_PREFIX="swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io"
          
          # 镜像映射关系 (SWR 镜像 -> 官方标准镜像)
          IMAGES=(
            "${SWR_PREFIX}/kubesphere/ks-apiserver:v4.1.2|kubesphere/ks-apiserver:v4.1.2"
            "${SWR_PREFIX}/kubesphere/ks-console:v4.1.2|kubesphere/ks-console:v4.1.2"
            "${SWR_PREFIX}/kubesphere/ks-controller-manager:v4.1.2|kubesphere/ks-controller-manager:v4.1.2"
            "${SWR_PREFIX}/kubesphere/kubectl:v1.27.16|kubesphere/kubectl:v1.27.16"
            "${SWR_PREFIX}/kubesphere/redis:7.2.4-alpine|kubesphere/redis:7.2.4-alpine"
            "${SWR_PREFIX}/kubesphere/haproxy:2.9.6-alpine|kubesphere/haproxy:2.9.6-alpine"
            "${SWR_PREFIX}/kubesphere/ks-extensions-museum:v1.1.2|kubesphere/ks-extensions-museum:v1.1.2"
            "${SWR_PREFIX}/kubesphere/ks-posthog:v2.0.0|kubesphere/ks-posthog:v2.0.0"
          )

          TARGET_IMAGES=()

          for item in "${IMAGES[@]}"; do
            SWR_IMG=$(echo "$item" | cut -d'|' -f1)
            STD_IMG=$(echo "$item" | cut -d'|' -f2)

            echo "===> Pulling from SWR: $SWR_IMG"
            docker pull "$SWR_IMG"

            echo "===> Retagging to standard: $STD_IMG"
            docker tag "$SWR_IMG" "$STD_IMG"

            TARGET_IMAGES+=("$STD_IMG")
          done

          # 导出打标后的标准名称镜像包
          echo "===> Saving all KubeSphere v4.1.2 images..."
          docker save -o output/kubesphere4.1/ks-core-images-v4.1.2.tar "${TARGET_IMAGES[@]}"

          # 打包归档
          cd output
          tar -zcvf kubesphere-v4.1.2-offline.tar.gz kubesphere4.1/
          rm -rf kubesphere4.1/
          
          # 放开目录权限
          sudo chmod -R 777 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealos-ks4.1.2-offline-packages
          path: |
            output/*.tar
            output/*.tar.gz
