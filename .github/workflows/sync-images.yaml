name: Sync Docker Images to ACR

on:
  push:
    paths:
      - 'images.txt'
  workflow_dispatch:
    inputs:
      force_sync:
        description: '是否强制重新同步所有镜像（即使 ACR 中已存在）'
        type: boolean
        required: false
        default: false

env:
  ACR_REGISTRY: crpi-qo844osa9k7fp3lm.cn-shenzhen.personal.cr.aliyuncs.com
  ACR_NAMESPACE: xhe_public

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 安装 Skopeo 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: 登录到阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 处理并同步增量镜像
        run: |
          if [ ! -f images.txt ]; then
            echo "❌ 找不到 images.txt 文件！"
            exit 1
          fi

          FORCE_SYNC="${{ inputs.force_sync }}"

          # 判断是 Push 还是手动触发
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "⚙️ 手动触发，扫描完整的 images.txt..."
            TARGET_CONTENT=$(cat images.txt)
          else
            echo "🔍 Git Push 触发，获取本次新增/修改的行..."
            # 获取上一 commit 与当前 commit 的 diff，过滤出以 + 开头的增量内容
            TARGET_CONTENT=$(git diff -U0 HEAD~1 HEAD -- images.txt | grep '^+[^+]' | sed 's/^+//' || true)
          fi

          if [ -z "$TARGET_CONTENT" ]; then
            echo "✅ 本次提交没有新增或修改镜像行，跳过同步。"
            exit 0
          fi

          echo "📋 待处理的镜像列表："
          echo "$TARGET_CONTENT"
          echo "----------------------------------------"

          # 💡 修复：使用 Here-String (<<<) 避免管道产生子 Shell，确保 exit 1 能够正常终止 Job
          while IFS= read -r line || [ -n "$line" ]; do
            line=$(echo "$line" | tr -d '\r')
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^#.*$ ]] && continue

            source_img=$(echo "$line" | awk '{print $1}')
            target_img=$(echo "$line" | awk '{print $2}')

            if [ -z "$target_img" ]; then
              image_name=$(basename "$source_img")
              target_img="${ACR_REGISTRY}/${ACR_NAMESPACE}/${image_name}"
            fi

            # 💡 核心优化：检测目标镜像是否已存在于 ACR 中
            if [ "$FORCE_SYNC" != "true" ]; then
              echo "🔍 检查目标镜像是否存在: $target_img"
              if skopeo inspect --creds "${{ secrets.ACR_USERNAME }}:${{ secrets.ACR_PASSWORD }}" "docker://$target_img" > /dev/null 2>&1; then
                echo "⏭️ 目标镜像已存在，跳过同步: $target_img"
                echo "----------------------------------------"
                continue
              fi
            fi

            echo "🚀 正在同步镜像: $source_img -> $target_img"
            
            # 使用 skopeo copy 同步镜像
            if skopeo copy --all \
                --dest-creds "${{ secrets.ACR_USERNAME }}:${{ secrets.ACR_PASSWORD }}" \
                "docker://$source_img" "docker://$target_img"; then
              echo "✅ 同步成功: $target_img"
            else
              echo "❌ 同步失败: $source_img"
              exit 1
            fi
            echo "----------------------------------------"
          done <<< "$TARGET_CONTENT"

          echo "🎉 镜像同步任务完成！"
