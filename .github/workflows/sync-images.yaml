name: Sync Docker Images to ACR

on:
  push:
    paths:
      - 'images.txt'      # 当 images.txt 被修改并 push 时自动触发
  workflow_dispatch:      # 允许在 GitHub 网页上手动点击运行

env:
  # 下面两个变量请替换为你自己的阿里云 ACR 信息！
  ACR_REGISTRY: crpi-qo844osa9k7fp3lm.cn-shenzhen.personal.cr.aliyuncs.com/xhe_public/test  # ACR 所在地域的域名（如杭州、北京等）
  ACR_NAMESPACE: xhe_public                      # 你的 ACR 命名空间

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录到阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 批量拉取、打标签并推送到 ACR
        run: |
          # 确保文件存在
          if [ ! -f images.txt ]; then
            echo "❌ 找不到 images.txt 文件！"
            exit 1
          fi

          echo "开始读取 images.txt 批量同步..."

          # 逐行读取 txt 文件
          while IFS= read -r line || [ -n "$line" ]; do
            # 去除 Windows 格式可能产生的 \r 换行符
            line=$(echo "$line" | tr -d '\r')
            
            # 忽略空行和注释行（以 # 开头）
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^#.*$ ]] && continue

            # 利用 awk 分离第一列和第二列
            source_img=$(echo "$line" | awk '{print $1}')
            target_img=$(echo "$line" | awk '{print $2}')

            # 如果只有一列，则自动生成目标镜像地址
            if [ -z "$target_img" ]; then
              # 提取镜像名称及标签，例如 a/b/c:v1 -> c:v1
              image_name=$(basename "$source_img")
              target_img="${ACR_REGISTRY}/${ACR_NAMESPACE}/${image_name}"
            fi

            echo "----------------------------------------"
            echo "🚀 正在拉取: $source_img"
            # 增加失败重试或退出机制
            if ! docker pull "$source_img"; then
               echo "❌ 拉取失败: $source_img ，跳过当前镜像继续往下执行..."
               continue
            fi

            echo "🏷️  正在打标: $source_img -> $target_img"
            docker tag "$source_img" "$target_img"

            echo "☁️  正在推送: $target_img"
            if ! docker push "$target_img"; then
               echo "❌ 推送失败: $target_img"
               exit 1
            fi
            
            # 清理本地镜像，防止同步大量镜像时打爆 GitHub 运行器的磁盘
            echo "🧹 清理本地缓存以释放空间..."
            docker rmi "$source_img" "$target_img"
            
          done < images.txt
          
          echo "🎉 全部同步任务执行完毕！"
